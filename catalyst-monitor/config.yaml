# 催化剂监控清单
# 每个条目：股票代码、公司名、关注的临床试验 NCT 编号、新闻匹配关键词
# keywords 会用于 RSS 新闻标题/摘要的匹配（不区分大小写），
# 建议同时放：药物代号、通用名、靶点、适应症、合作方名称
watchlist:
  - symbol: ABCL
    company: AbCellera Biologics
    nct_ids:
      - NCT07118891   # ABCL635 更年期血管舒缩症状，Phase 1/2，主要完成 2027-02
      - NCT07108894   # ABCL575 首次人体 Phase 1（OX40L），主要完成 2027-04
    keywords:
      - AbCellera
      - ABCL635
      - ABCL575

# EDGAR 监控的申报类型（8-K 重大事件公告；外国公司用 6-K）
edgar:
  forms:
    - 8-K
    - 6-K
  # 回看窗口：3 天内的申报实时告警，3~30 天的作为历史建档（入库+AI 分析，不推送）
  lookback_days: 30

# 新闻 RSS 源（条目会先按 watchlist 关键词过滤，只推匹配的）
feeds:
  - name: PR Newswire Health
    url: https://www.prnewswire.com/rss/health-latest-news/health-latest-news-list.rss
  - name: FierceBiotech
    url: https://www.fiercebiotech.com/rss/xml
  # GlobeNewswire 的 RSS 国内直连超时；若部署到境外 VPS 可加：
  # - name: GlobeNewswire Public Companies
  #   url: https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies
  # 也可以加目标公司 IR 页的 RSS（最直接的公告源）

# 盘面异动检测（需在 .env 配置 ALPACA_API_KEY/SECRET）
market:
  benchmark: XBI          # 行业基准 ETF，扣除板块共振
  sigma_threshold: 2.5    # 5分钟 abnormal return 超过历史波动的倍数
  rvol_threshold: 3       # 相对成交量放大倍数

# 各采集器轮询间隔（分钟）
poll:
  clinicaltrials_minutes: 15
  edgar_minutes: 5
  halts_minutes: 2
  rss_minutes: 5
  market_minutes: 2
